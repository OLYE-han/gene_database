confirmation:
  queries: 50000
  repetitions: 3
  layouts: baseline and top two; alternate order
  primary: median QPS among all zero-query-failure, recall >= .95, budget/no-revisit
    compliant runs; keep network metric completeness as a separate flag
  secondary: report p99; within 3% QPS prefer fewer threads and lower p99
constraints:
- No implementation changes during comparison; use committed binaries and record hashes
- Network reactor counts fixed min=max; no adaptive variation during causal thread
  sweeps
- Connections per reactor = 128 / send reactors; record actual thread and connection
  counts
- Receive queue capacity per reactor = 4096 / receive reactors; total pending limits
  fixed
- Native network_module and adaptive_control are mutually exclusive; do not sweep
  incompatible controls
- Legacy Python transfer_workers/control_workers/head_lanes do not control this C++
  path and are not claimed as tested knobs
- Homogeneous data search thread count is required by current protocol configuration
  signature
- Results describe the tested configuration space, dataset and concurrency; not a
  proof of global optimum
- CPU load and full query records retained; p99 overall and cross-node timelines for
  final contenders
- Compress raw results only after verified archival; never change completion timestamps
  or omit failed requests
- Initial 10k screening used the archived 4GiB capture cap without overflow; remaining
  and all 50k confirmations use 32GiB to keep archival outside measured queries. This
  is a capture threshold, not a search budget change.
- A paused refinement run had 3 late-heartbeat network-counter records incomplete,
  but all 10000 results succeeded. Retain this run and all slow requests; do not filter
  performance by network metric completeness. See metrics_audit_notes.json.
