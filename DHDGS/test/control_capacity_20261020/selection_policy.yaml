# Latest user priority: throughput first; tail latency remains fully reported.
primary_metric: qps
direction: maximize
aggregate_across_rounds: median
minimum_mean_recall_at_10: 0.95
maximum_failed_queries: 0
require_all_audits: true
p99_limit_ms: null
# Select only among successfully measured configurations; no extrapolation.
candidate_modes: [c128, c256, c512, c1024]
sustained_queries: 100000
sustained_repeat_selection: true
sustained_case_timeout_seconds: 900
sustained_callback_port: 30000
window_seconds: 10.0
