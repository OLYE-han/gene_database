[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dhdgs"
version = "0.2.0"
description = "DHDGS experimental distributed hierarchical disk graph search"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "msgpack>=1.1,<2", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
build = ["pybind11>=2.13,<4"]

[project.scripts]
dhdgs = "dhdgs.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
