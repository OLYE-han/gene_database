# 唯一运行配置。相对路径均相对于本 YAML 所在目录，而非当前工作目录。
# 当前默认是端到端 pilot；提高 row_limit 前检查 build.memory_limit_bytes。
version: 1
seed: 42
runtime:
  blas_threads: 1
  python_switch_interval_ms: 5.0 # 进程级Python线程切换间隔；同进程所有Engine必须配置一致
metrics:
  detailed_trace: true
  trace_query_ids: []          # 指定需要逐批次/逐读轨迹的 uint64 查询 ID
  lifecycle_trace: false      # 所有查询仅记录分支/线程/控制消息关键时间戳
  gc_trace: false             # 进程级 Python GC 回调诊断，不改变 GC 策略
  resource_sample_interval_ms: 100
  resource_max_samples: 1024
paths:
  dataset: ../../Data/seq_2M
  output: ../artifacts/yaml_run
data:
  metric: l2                 # l2 | cosine；实验默认值，不代表距离语义已定案
  dimension: 2560
  row_limit: 4096            # 0 表示全库；pilot 从全库均匀抽样，不取前缀
  block_rows: 1024
  inspection_rows: 128
partition:
  method: margin            # margin | boundary | relative_gap
  overlap_fraction: 0.1
  max_copies: 3
  train_rows: 1024
  calibration_rows: 1024
  kmeans_iterations: 100
  kmeans_tolerance: 0.000001
build:
  memory_limit_bytes: 2147483648   # 保守的向量/编码/图构建预估上限
  degree: 24
  candidate_list_size: 64
  prune_alphas: [1.0, 1.2]
quantization:
  bits: 1                   # RaBitQ 总位数，1..9，包括 sign bit
storage:
  page_bytes: 4096
  cache_bytes_per_shard: 0  # 默认不启用共享 LRU，读取不获取缓存锁；不代表禁用 OS page cache
  io:
    backend: sync_pread       # native: sync_pread | io_uring | thread_pool；聚合异步后端需 TCP 数据服务
    fallback_backend: error   # error | thread_pool；启动失败不能静默回退
    worker_threads: 4         # thread_pool 后端的 I/O 线程，不是计算线程
    max_submit_requests: 8
    max_inflight_per_query: 4
    max_inflight_per_device: 32 # 每进程配额；共用SSD时应手工分配总额度，启动器报告合计
    max_inflight_bytes_per_device: 4194304
    buffer_pool_bytes_per_device: 16777216 # 整轮预留，包含原生到Python复制的双份空间
    max_pending_batches: 128
    max_completion_events_per_poll: 64
    completion_poll_ms: 1
routing:
  sample_ratio: 0.05
  min_samples: 64
  max_samples: 20000
  hnsw_m: 16
  ef_construction: 100
  ef_search: 64
  entry_candidates: 16
search:
  execution: peer           # peer 默认数据节点自主执行；reference 仅保留为实验对照
  top_k: 10
  frontier_size: 64
  max_expansions: 192         # 2M 完整索引的 95% 目标校准值；128 在本轮校准中为94.92%
  local_beam: 4
  max_inflight: 3
  exclude_self: true
  fallback_enabled: true
  max_fallback_entries: 2
  stagnation_batches: 8
peer:
  control:
    scheduler: event         # scan/event: Python对照；native: C++完成/结果回传（native搜索+TCP+sync_pread）
    max_events_per_turn: 0   # event每轮分别限制完成/dirty/timer事件；0为无界，本轮保留
    completion_fast_path: false # event无远端派发时try-lock发布；锁忙立即退回完成队列
    initial_heartbeat_delay_ms: 0 # optimized模式；不超过heartbeat_interval_ms，仅延后无状态变化的首个心跳
  connection_pool:
    probe_mode: reserved     # locked: 历史对照；reserved: 预约借用名额后在锁外探测/关闭连接
    head_scheduling: fifo    # 顶层入口按目标FIFO预约/定向唤醒；broadcast保留旧实验行为
  compute:
    mode: executor           # executor | prestarted | fixed；固定队列目前仅支持native
    queue_capacity: 128      # fixed模式等待队列上限；运行中任务不占此容量
  sender:
    mode: queued             # queued: 预启动发送线程；executor: 历史对照
    transfer_queue_capacity: 128 # 等待派发的任务上限，不含正在发送的任务
  admission:
    mode: buffered            # 接纳成功入队即确认；direct 保留同步提交对照
    queue_lock: shared        # shared: 历史对照；independent: 队列独立短锁
    dispatch_threads: 1       # 接纳队列消费者；只提交分支，不参与查询距离计算
    queue_capacity: 128        # 已接纳但尚未开始计算，含已交给计算线程池的任务
  communication:
    mode: optimized           # legacy 保留旧通信行为，用于对照实验
    transfer_workers: 16      # 仅发送扩展函数批准的远端分支
    control_workers: 16       # 心跳/结果的有界并发发送
    max_pending_control: 64   # 排队和在途控制任务的总上限
    reuse_connections: true
    connections_per_endpoint: 8
    max_connection_endpoints: 64
  execution_model: native    # native: C++循环、每分支固定计算线程；blocking/resumable 为 Python 对照
  max_branches: 16          # 上限；每节点至多启动一次，实际还受服务器数量限制
  child_budget_fraction: 0.5
  worker_threads: 8          # 每查询分支固定一个线程；不同查询并行，非单查询内并行
  max_active_queries: 128
  heartbeat_interval_ms: 250
  lease_timeout_ms: 5000
  query_timeout_seconds: 30.0
  control_timeout_seconds: 1.0
  handoff_timeout_seconds: 5.0
  retention_seconds: 60.0
  max_tombstones: 4096
  head_bind_host: 127.0.0.1
  head_advertise_host: 127.0.0.1
  head_port: 0               # 0 由 OS 分配回调端口；多机时 advertise_host 必须可达
  head_receiver_processes: 0 # 0=原进程接收；1..32=独立报告接收进程，固定端口时使用 head_port+i
  head_receiver_ipc: shared  # shared=旧通道；split=注册/派发确认与终态报告分离
  head_query_workers: 0      # 0=旧同步入口；>0=事件续执行线程数，要求接收进程>0且IPC=split
  head_pipeline:
    enabled: false           # 单进程流水线；启用时receiver_processes/query_workers均设为0
    receive_min: 1
    receive_max: 4
    receive_backlog: 8       # 接纳或路由队列每积压此数量增加一个接收线程
    receive_idle_ms: 100     # 无明显积压持续此时间后缩减
    route_workers: 16
    merge_workers: 1
    dispatch_workers: 4
    callback_connections: 128
    ack_inline: true         # 收到完整报告立即尝试非阻塞ACK，余量再等待可写事件
  head_entry_workers: 4      # 每个接收进程的初始派发线程数；不参与数据节点候选扩展
  head_lanes:
    enabled: false
    processes: 4
    route_threads: 1
    dispatch_threads: 4
    callback_connections: 128
    startup_timeout_seconds: 180.0
    save_results: true
    results_directory: test/control_capacity_20261020/results
  head_direct:
    result_backend: process  # inline removes result IPC; requires process report receivers
    enabled: false
    distribution_threads: 16
    confirmation_threads: 2
    result_processes: 16
    ack_timeout_ms: 1000
    submit_retries: 1        # 相同request/branch身份重传，不产生新搜索分支
    result_queue_capacity: 2048
    startup_timeout_seconds: 60.0
    save_results: true
    results_directory: test/direct_distribution_20261020/results
    queued_reports: false   # opt-in until three-host channel comparison completes
    report_backend: thread # thread | process (independent receiver GILs)
    report_registration: ipc # ipc | shared (process backend identity publication)
    completion_dispatch: queued # inline lets terminal pipe consumer submit merge directly
    result_channels: 8      # ports head_port + confirmation_threads + channel
    report_queue_capacity: 64  # bounded inbox per channel, TCP backpressure when full
    report_connections_per_channel: 64
    completion_threads: 2   # registry completion/continuations, never socket loops
scheduler:
  mode: adaptive            # adaptive | reference | local_first
  kappa: 1.0
  exploration: 0.02
  max_wait_ms: 1.0          # 仅在本节点首次派发前生效；派发后只搜索本地
  local_batch_ms: 0.15       # 冷启动估值；运行时由测量更新
  remote_rtt_ms: 0.5
  bandwidth_bytes_per_ms: 100000.0
  ewma_weight: 0.2
  remote_selection: probabilistic # probabilistic | threshold
  remote_weight: 1.0        # 0 禁用非强制远端分支；越大越偏向跨机
  probability_temperature: 1.0
network:
  listen_backlog: 128       # 数据服务和入口回调的待接收 TCP 连接队列
  transport: local          # local | tcp；local 仍从各分片文件 pread，非网络性能测试
  batch_size: 8
  timeout_seconds: 30.0
  max_message_bytes: 8388608
  max_retries: 1
cluster:
  nodes:                    # 长期为本机、intel-32、intel-30；当前回环端口用于进程联调
    - id: 0
      host: 127.0.0.1
      port: 19101
      index_directory: null # null => output/index/shard_<id>
    - id: 1
      host: 127.0.0.1
      port: 19102
      index_directory: null
    - id: 2
      host: 127.0.0.1
      port: 19103
      index_directory: null
query:
  vectors: ../../Data/seq_2M/seq_2M/queries200K/queries.npy
  ids: ../../Data/seq_2M/seq_2M/queries200K/query_ids.npy
  row: 0
assignment:
  model: ../artifacts/yaml_run/partition/seed_42/model_l2.npz
  threshold: ../artifacts/yaml_run/partition/seed_42/threshold_l2_margin_0.1.json
experiment:
  metrics: [l2, cosine]
  overlap_fractions: [0.0, 0.05, 0.1, 0.2, 0.3]
  seeds: [42, 43, 44]
  train_rows: 2048
  calibration_rows: 2048
  evaluation_rows: 4096
  benchmark_queries: 16
  benchmark_concurrency: 1
  benchmark_repetitions: 1
  warmup_queries: 0
  exact_block_rows: 1024
  target_recall: 0.95
