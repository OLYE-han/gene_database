peer:
  # RPC baseline; optional verbs READ from registered source memory, never direct SSD READ.
  candidate_sync:
    nonblocking_start: false # 一次首次接纳，冻结预算后源继续搜索
    early_result: false # 搜索结果提前报告；顶层仍等待交付闭环
    completion_threads: 0 # 0保留旧回调；实验使用独立完成池
    completion_capacity: 8192
    start_threads: 0 # 可选首次任务接纳池；短控制消息不排在重接纳之后
    start_capacity: 8192
    coalesce_pending: false # 每目标最多一个在途候选包，其余合并缓存
    max_buffered_records: 4096 # 每查询分支、每目标的候选缓存上限
    skip_exhausted_targets: false # 实验开关：收到预算零回执后省去后续无效候选包
    early_budget_report: true # 已耗尽预算且已发增量均确认后直接报告
    enabled: false # 2026-11-05：原成本分支为基线；同步实现保留，暂停维护
    interval_expansions: 10
    max_records: 64
  demand_growth:
    ssd_directories: {}  # Optional per-node absolute SSD directory overrides.
    enabled: false
    cache_records: 100
    promotion_hot_vertices: 20
    growth_fraction: 0.10
    promotion_trigger: full_no_singleton
    persist: true
    indexed_directory: false # Immutable durable index + monotone negative cache filter.
    persistence_pipeline: false # Prepare concurrently with a single ordered journal writer.
    persistence_queue_batches: 2 # Includes the frame currently being written.
    persistence_queue_bytes: 134217728 # Serialized pending frames; each also obeys maintenance_bytes.
    maintenance_interval_ms: 0 # 0 keeps legacy wake-on-hit; test 2 ms with the pipeline.
