dimension: 2560
metric: cosine
num_partitions: 16
seed: 42
batch_size: 4096
hnsw:
  sample_size: 100000
  # Sample at least 20% of the corpus (sample_size is the lower bound).
  sample_ratio: 0.20
  m: 32
  ef_construction: 200
  ef_search: 128
  route_nodes: 64
  route_partitions: 2
  partition_backend: kaffpa
  # Or export PYRAMID_KAFFPA_EXECUTABLE=/absolute/path/to/kaffpa.
  kaffpa_executable: kaffpa
  kaffpa_preconfiguration: strong
  # Production builds should fail instead of silently using the fallback.
  require_kaffpa: true
ivf:
  target_vectors_per_list: 384
  nprobe: 2
  train_size: 100000
  candidate_multiplier: 8
  scan_block_size: 4096
